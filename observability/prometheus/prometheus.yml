# EPIC 8 (US-8.2) — scrapes bot-api's /metrics (prom-client, see
# apps/bot-api/src/lib/metrics.ts) plus the Postgres/Redis exporters added
# alongside it in docker-compose.yml. All targets are addressed by their
# Compose service name — this file only runs inside the Compose network,
# never exposed outside it (see docker-compose.yml's comments on why
# prometheus/grafana have no published ports).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: bot-api
    static_configs:
      - targets: ["api:3000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
