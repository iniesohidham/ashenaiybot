# EPIC 8 (US-8.1/8.2) — auto-provisioned so a fresh Grafana container comes
# up with both datasources wired, no manual click-through setup. Fixed `uid`s
# (not Grafana's auto-generated ones) so the dashboard JSON files under
# ../dashboards/ can reference them by a stable id.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
