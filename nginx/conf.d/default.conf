upstream bot_api {
    server api:3000;
}

upstream web_miniapp {
    server web-miniapp:3001;
}

upstream web_admin {
    server web-admin:3002;
}

server {
    listen 80;
    server_name _;

    # Once a certificate is configured (see nginx/conf.d/ssl.conf.disabled),
    # uncomment the next line to force HTTPS and drop the location blocks
    # below in favor of the ones in the HTTPS server block.
    # return 301 https://$host$request_uri;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://bot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://web_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web_miniapp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
