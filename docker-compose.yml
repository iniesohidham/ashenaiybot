name: ashenaiybot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/bot-api/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"

  worker:
    build:
      context: .
      dockerfile: apps/bot-api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-miniapp:
    build:
      context: .
      dockerfile: apps/web-miniapp/Dockerfile
    restart: unless-stopped
    env_file: .env
    expose:
      - "3001"

  web-admin:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
    restart: unless-stopped
    env_file: .env
    expose:
      - "3002"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web-miniapp
      - web-admin

  # --- EPIC 8 (US-8.1/8.2) — Analytics/Observability stack ------------------
  # None of these publish a port through nginx (no /metrics, /prometheus, or
  # /grafana location exists in nginx/conf.d/default.conf) — they're internal
  # tooling for operators, not end users. Grafana is the one exception that
  # needs to be reachable at all (see its own `ports` below); the rest are
  # only ever addressed by their Compose service name from inside this
  # network (Prometheus scraping them, Grafana querying Prometheus/Loki).

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - postgres-exporter
      - redis-exporter

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    volumes:
      - loki_data:/loki

  # Ships every container's stdout/stderr to Loki (US-8.1's "shipped to a
  # centralized location") — needs the Docker socket (read-only) to discover
  # containers, same access pattern any Docker-aware log shipper needs.
  promtail:
    image: grafana/promtail:3.2.1
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  # The one observability service actually meant for a human to open in a
  # browser — published on a host port rather than routed through nginx
  # (deliberately: this is operator tooling, not part of the public product
  # surface any of the three apps above serve). On the single-VPS deployment
  # this project targets (PRD §2 A5), restrict 3003 at the firewall (or
  # reach it over an SSH tunnel: `ssh -L 3003:localhost:3003 <host>`) rather
  # than opening it to the internet — there's no auth in front of it beyond
  # Grafana's own login.
  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # `:-` fallback (not bare `${GRAFANA_ADMIN_PASSWORD}`) deliberately —
      # an unset var renders as an EXPLICIT empty string in Compose's
      # substitution, which Grafana treats as "the admin password is blank"
      # rather than falling back to its own safe built-in default. The
      # fallback below is an obvious, unmistakable placeholder (matches
      # SEED_ADMIN_PASSWORD's own "ChangeMe123!" convention) so a missed
      # .env entry fails loudly (a guessable-but-visible password) instead
      # of silently shipping a blank one.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ChangeMe123!}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
